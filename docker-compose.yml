services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terrapulse
      POSTGRES_USER: terrapulse
      POSTGRES_PASSWORD: terrapulse
    ports:
      - "5433:5432"
    volumes:
      - terrapulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrapulse -d terrapulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  terrapulse-postgres:

